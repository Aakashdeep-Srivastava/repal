name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── CI: tests must pass before anything deploys (runs on every push + PR) ──
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Test (deterministic core + tnc golden eval)
        run: npm test
      - name: Build
        run: npm run build

  # ── CD: build image → push to ECR → roll out to ECS → smoke-test ──
  # Runs only on push to main, only after `verify` is green. Auth is GitHub OIDC
  # → the repal-github-deploy IAM role (no AWS keys stored). The ECS service has
  # a deployment circuit breaker with auto-rollback, so a bad image self-heals.
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # mint the OIDC token to assume the AWS role
      contents: read
    environment:
      name: production
      url: https://d14t147d5f4q6i.cloudfront.net
    env:
      AWS_REGION: us-west-2
      ECR_REPOSITORY: repal-web
      ECS_CLUSTER: repal
      ECS_SERVICE: repal-web
      CONTAINER_NAME: repal-web
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Render new task definition (inject image)
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs-task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test (health must be 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://d14t147d5f4q6i.cloudfront.net/api/health || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 10
          done
          echo "::error::post-deploy health check never returned 200"
          exit 1

  # ── Notify Discord with the CI/CD outcome (who pushed, pass/fail) ──
  # Runs for every push to main regardless of success, so the team sees every
  # deploy. The webhook is an encrypted repo secret; the step no-ops if unset.
  notify:
    needs: [verify, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Post deploy status to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then echo "DISCORD_WEBHOOK not set — skipping"; exit 0; fi
          if [ "$DEPLOY_RESULT" = "success" ]; then
            title="✅ RePal deployed to production"; color=3066993
          elif [ "$VERIFY_RESULT" != "success" ]; then
            title="❌ RePal CI failed — tests did not pass (no deploy)"; color=15158332
          else
            title="❌ RePal deploy failed (deploy=$DEPLOY_RESULT)"; color=15158332
          fi
          jq -n \
            --arg t "$title" --argjson c "$color" \
            --arg msg "${COMMIT_MSG:-}" --arg actor "$ACTOR" \
            --arg commit "$SERVER/$REPO/commit/$SHA" --arg short "${SHA:0:7}" \
            --arg run "$RUN_URL" --arg app "https://d14t147d5f4q6i.cloudfront.net" \
            '{embeds:[{title:$t,color:$c,url:$app,fields:[
               {name:"Commit",value:("["+$short+"]("+$commit+")"),inline:true},
               {name:"By",value:$actor,inline:true},
               {name:"Run",value:("[logs]("+$run+")"),inline:true},
               {name:"Message",value:(($msg|split("\n")[0])[0:300])}]}]}' \
          | curl -fsS -H 'Content-Type: application/json' -X POST "$WEBHOOK" -d @- && echo "notified"
