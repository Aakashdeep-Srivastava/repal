name: DB keep-alive

# Pings the Neon database daily so it stays warm/healthy for the demo and
# judging window. Runs on GitHub's infra — works even before we deploy.
# Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure psql
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Ping Neon (SELECT 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it: gh secret set DATABASE_URL"
            exit 1
          fi
          echo "Pinging database…"
          psql "$DATABASE_URL" -tAc "SELECT 'ok', now();"
          echo "✓ database healthy"
