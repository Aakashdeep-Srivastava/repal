# Local Postgres for development (judges can `docker compose up -d`).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: repal
      POSTGRES_PASSWORD: repal
      POSTGRES_DB: repal
    ports:
      - "5432:5432"
    volumes:
      - repal_pgdata:/var/lib/postgresql/data

volumes:
  repal_pgdata:
